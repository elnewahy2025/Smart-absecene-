name: CI Security Audit

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    env:
      # Tests exercise the AES-256-GCM tenant secret helpers. The value is a
      # throwaway CI key, never a production secret.
      TENANT_ENCRYPTION_MASTER_KEY: ci-only-tenant-encryption-master-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Secret scan
        run: node scripts/ci-security-audit.mjs

      - name: Env file protection check
        run: |
          if [ -f .env ]; then
            echo ".env file is present. Remove it from source control."
            exit 1
          fi

      - name: Example env check
        run: |
          test -f .env.example

      - name: Build check
        run: npm run build

      - name: Run automated unit tests
        run: npm run test
