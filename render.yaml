# Render blueprint — one-click setup for the free Docker web service.
# Docs: https://render.com/docs/blueprint-spec
#
# After connecting this repo in Render, fill the secret values marked
# `sync: false` in the Render dashboard (they are never stored in git).

services:
  - type: web
    name: smart-school-attendance
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEV_AUTH
        value: "false"
      - key: VITE_USE_FIREBASE_EMULATOR
        value: "false"

      # --- secrets / per-deployment values: set these in the dashboard ---
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: TENANT_ENCRYPTION_MASTER_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PLATFORM_OWNER_EMAILS
        sync: false
      - key: DEFAULT_TENANT_ID
        sync: false

      # --- Firebase web config (public, but baked into the client at build) ---
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false
      - key: VITE_FIREBASE_FIRESTORE_DATABASE_ID
        sync: false
      - key: VITE_FIREBASE_OAUTH_CLIENT_ID
        sync: false
      - key: VITE_FIREBASE_RECAPTCHA_SITE_KEY
        sync: false
      - key: VITE_PLATFORM_OWNER_EMAIL
        sync: false
      - key: VITE_PLATFORM_OWNER_EMAILS
        sync: false
      - key: VITE_DEFAULT_TENANT_ID
        sync: false

      # Uncomment only if the service sits behind another proxy.
      # - key: TRUST_PROXY
      #   value: "1"
